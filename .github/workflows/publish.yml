name: Publish

# Release pipeline (ADR-0009, amended 2026-07-23): a v* tag re-runs the full merge
# gate — `npm run verify` (now including knip) + a Trivy scan — then rebuilds and
# publishes to npm via OIDC **trusted publishing** (no token). Re-running verify +
# Trivy makes a release a strict superset of the merge gate, so a tag can never
# ship code that skipped those checks (US-10). Releases are cut manually — `npm
# version <bump>` then `git push --follow-tags` — so publishing is a deliberate,
# auditable act. A failing verify, scan, or build aborts before anything reaches npm.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: verify + scan + build + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm trusted publishing (also drives automatic provenance).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing (ADR-0009).
          # `registry-url` is required: OIDC only engages when the registry is
          # explicitly configured. It also makes setup-node write a placeholder
          # `_authToken` line, which is stripped in the next step (see below).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable OIDC trusted publishing
        # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` when
        # registry-url is set; with no token that placeholder makes npm use token auth
        # and skip the OIDC exchange (actions/setup-node#1551). Strip only that line so
        # the explicit registry stays (OIDC needs it) but npm falls through to trusted
        # publishing. The echo confirms the OIDC env is present without leaking it.
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm ci
      # Re-run the merge gate: verify (prettier, eslint, tsc, vitest, knip,
      # archgate) then the same HIGH/CRITICAL Trivy gate as security.yml, so a
      # release cannot ship code that skipped either (US-10).
      - run: npm run verify
      - name: Trivy gate (HIGH / CRITICAL — fail)
        uses: aquasecurity/trivy-action@v0.36.0
        # Scan dev deps: the published package ships zero runtime deps, so every
        # entry in package-lock.json is a devDependency Trivy would otherwise
        # suppress (mirrors security.yml).
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: npm run build
      # Trusted publishing: the npm CLI detects the GitHub Actions OIDC environment
      # and authenticates with no token; provenance is attached automatically.
      # Requires a trusted publisher for this package on npmjs.com (this repo +
      # this workflow filename); OIDC cannot create a new package, so the first
      # version is published manually (see ADR-0009). prepublishOnly rebuilds as a
      # last guard so a stale or missing bundle can never ship (US-11, US-23).
      - run: npm publish --access public
