name: CI

# Correctness pipeline (ADR-0009, amended 2026-07-23). One `verify` job that runs
# every deterministic check as its own named step — a red run names the failing
# check without opening logs — then builds and boot-smokes the published artifact.
# Security scanning lives in security.yml; publishing lives in publish.yml.
#
# Triggers: pushes to `main` and every pull request. A feature branch with an open
# PR therefore runs once (on the PR), not twice — a branch with no PR gets no CI,
# which is acceptable under a PR-based flow.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only token instead of the default broad one.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run, so feedback stays fast
# and cheap. Push and PR runs live in separate groups (distinct refs) and do not
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so archgate's base-branch comparison has the refs it needs.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24 only: the sole supported range (package.json engines `>=24`),
          # and the version publish.yml ships on. Dropping the 22/24 matrix roughly
          # halves the run for no lost coverage.
          node-version: '24'
          cache: npm
      # Clean, lockfile-pinned install (ADR-0009).
      - run: npm ci
      # Deterministic checks, cheapest / likeliest-to-fail first so a common
      # failure surfaces soonest. Each is its own named step (US-1). This mirrors
      # the `npm run verify` chain, split for legibility.
      - name: prettier
        run: npm run format:check
      - name: eslint
        run: npx eslint .
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npm test
      # knip: unused files / deps / exports. knip.json marks the governance rule
      # files (`.archgate/adrs/*.rules.ts`) as entry points — the archgate binary
      # loads them dynamically, so knip cannot see the reference and would else
      # falsely flag them; their helpers are reached via those entries and the
      # rule tests (relates to #35).
      - name: knip
        run: npm run knip
      # archgate last among the source checks: it is the slowest and the least
      # likely to fail on a WIP push.
      - name: archgate
        run: npx archgate check
      # The committed Core bundle asset must equal its canonical source in
      # .archgate/ (ADR-0010 §1): re-capture and fail on any drift — a modified,
      # added, or removed file — so a released bundle can never lag the ADRs.
      # Realizes the US-16 capture-freshness guard that main reserved a slot for.
      - name: Core bundle asset is fresh
        run: |
          npm run capture
          if [ -n "$(git status --porcelain -- assets)" ]; then
            echo "::error::Core bundle asset is stale — run 'npm run capture' and commit assets/."
            git status --porcelain -- assets
            git --no-pager diff -- assets
            exit 1
          fi
      # Self-apply dogfood (ADR-0010 §4, DoD): run the CLI's own install path
      # against this repo (the harness self-applies) and fail on any bundle diff.
      # The bundle is Tool-owned (overwritten every run) with NO skip-self guard,
      # so a clean `.archgate/**` + `.claude/rules/` diff proves the overwrite path
      # reproduces the committed source byte-for-byte. Runs after the freshness
      # guard so it reads an asset already proven equal to canonical.
      - name: Self-apply is a clean overwrite
        run: |
          npm run self-apply
          if [ -n "$(git status --porcelain -- .archgate .claude/rules)" ]; then
            echo "::error::Self-apply drifted the Core bundle — committed .archgate/** or .claude/rules/ differs from the tool output. Run 'npm run self-apply' and commit."
            git status --porcelain -- .archgate .claude/rules
            git --no-pager diff -- .archgate .claude/rules
            exit 1
          fi
      # Build the single-file bundle, then boot-smoke the *published artifact* —
      # catches a bundling break (bad entry, dropped import, broken shebang) that
      # source-level tests cannot (ADR-0009).
      - name: build
        run: npm run build
      - name: boot-smoke
        run: npm run smoke
